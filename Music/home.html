<style>
/* ========================================
   EDEN MUSIC PAGE
======================================== */

#eden-music-page {
  --em-bg: #080b13;
  --em-panel: #111827;
  --em-line: rgba(139, 165, 224, .22);
  --em-text: #f4f6fc;
  --em-muted: #94a2ba;
  --em-accent: #a9beff;

  position: relative;
  isolation: isolate;
  width: 100%;
  min-height: 100vh;
  padding: 0 clamp(18px, 4vw, 48px);
  background: transparent !important;
  color: var(--em-text);
  font-family: Arial, "Helvetica Neue", sans-serif;
  box-sizing: border-box;
  overflow-wrap: anywhere;
}

#eden-music-page *,
#eden-music-page *::before,
#eden-music-page *::after {
  box-sizing: border-box;
}

#eden-music-page a {
  color: inherit;
  text-decoration: none;
}

/* コンテンツを背景より前面に配置 */
#eden-music-page > :not(.eden-ambient-bg) {
  position: relative;
  z-index: 1;
}

/* ========================================
   CINEMATIC ANIMATED BACKGROUND
======================================== */

#eden-music-page .eden-ambient-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(
      ellipse at 50% 0%,
      rgba(25, 42, 85, .65) 0%,
      transparent 60%
    ),
    linear-gradient(
      135deg,
      #070a16 0%,
      #0b1024 48%,
      #080812 100%
    );
}

/* 粒子キャンバス */
#eden-music-page #eden-light-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  opacity: .9;
}

/* 大きな発光レイヤー */
#eden-music-page .eden-ambient-glow {
  position: absolute;
  width: 62vw;
  height: 62vw;
  min-width: 300px;
  min-height: 300px;
  max-width: 850px;
  max-height: 850px;
  border-radius: 50%;
  filter: blur(65px);
  will-change: transform;
}

/* ブルーの光 */
#eden-music-page .glow-blue {
  top: -32%;
  left: -28%;
  background: radial-gradient(
    circle,
    rgba(40, 105, 255, .55) 0%,
    rgba(35, 75, 200, .2) 42%,
    transparent 72%
  );
  animation: eden-blue-flow 12s ease-in-out infinite alternate;
}

/* パープルの光 */
#eden-music-page .glow-purple {
  top: 8%;
  right: -32%;
  background: radial-gradient(
    circle,
    rgba(145, 56, 255, .43) 0%,
    rgba(104, 48, 200, .15) 45%,
    transparent 72%
  );
  animation: eden-purple-flow 16s ease-in-out infinite alternate;
}

/* シアンの光 */
#eden-music-page .glow-cyan {
  bottom: -45%;
  left: 8%;
  background: radial-gradient(
    circle,
    rgba(0, 174, 255, .4) 0%,
    rgba(35, 100, 230, .12) 45%,
    transparent 72%
  );
  animation: eden-cyan-flow 18s ease-in-out infinite alternate;
}

/* 光の移動 */
@keyframes eden-blue-flow {
  0% {
    transform: translate3d(-5%, -2%, 0) scale(.82);
  }
  50% {
    transform: translate3d(28%, 20%, 0) scale(1.13);
  }
  100% {
    transform: translate3d(55%, 5%, 0) scale(.96);
  }
}

@keyframes eden-purple-flow {
  0% {
    transform: translate3d(10%, -8%, 0) scale(.85);
  }
  50% {
    transform: translate3d(-30%, 24%, 0) scale(1.16);
  }
  100% {
    transform: translate3d(-8%, 45%, 0) scale(.92);
  }
}

@keyframes eden-cyan-flow {
  0% {
    transform: translate3d(-10%, 10%, 0) scale(.8);
  }
  50% {
    transform: translate3d(45%, -30%, 0) scale(1.2);
  }
  100% {
    transform: translate3d(70%, -5%, 0) scale(.95);
  }
}

/* ========================================
   MOVING LIGHT BEAMS
======================================== */

#eden-music-page .eden-light-beam {
  position: absolute;
  left: -60%;
  width: 220%;
  height: 3px;
  opacity: 0;
  transform: rotate(-24deg);
  background: linear-gradient(
    90deg,
    transparent 0%,
    transparent 24%,
    rgba(60, 120, 255, .08) 36%,
    rgba(89, 151, 255, .9) 48%,
    rgba(199, 146, 255, .85) 51%,
    rgba(80, 135, 255, .2) 57%,
    transparent 73%,
    transparent 100%
  );
  box-shadow:
    0 0 10px rgba(78, 131, 255, .55),
    0 0 35px rgba(89, 112, 255, .25);
  will-change: transform, opacity;
  animation: eden-beam-travel 9s linear infinite;
}

#eden-music-page .beam-one {
  top: 22%;
  animation-delay: -2s;
}

#eden-music-page .beam-two {
  top: 58%;
  height: 2px;
  animation-duration: 12s;
  animation-delay: -7s;
  filter: hue-rotate(35deg);
}

#eden-music-page .beam-three {
  top: 82%;
  height: 2px;
  animation-duration: 15s;
  animation-delay: -11s;
  filter: hue-rotate(65deg);
}

@keyframes eden-beam-travel {
  0% {
    transform: translate3d(-18%, -120px, 0) rotate(-24deg);
    opacity: 0;
  }
  12% {
    opacity: .75;
  }
  55% {
    opacity: .45;
  }
  88% {
    opacity: .65;
  }
  100% {
    transform: translate3d(42%, 120px, 0) rotate(-24deg);
    opacity: 0;
  }
}

/* 薄い格子模様 */
#eden-music-page .eden-ambient-grid {
  position: absolute;
  inset: 0;
  opacity: .14;
  background-image:
    linear-gradient(
      rgba(155, 180, 255, .08) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(155, 180, 255, .08) 1px,
      transparent 1px
    );
  background-size: 76px 76px;
  animation: eden-grid-shift 32s linear infinite;
}

@keyframes eden-grid-shift {
  from {
    background-position: 0 0;
  }
  to {
    background-position: 76px 76px;
  }
}

/* 四隅の暗さ */
#eden-music-page .eden-ambient-shade {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    ellipse at center,
    transparent 20%,
    rgba(3, 5, 15, .22) 65%,
    rgba(3, 5, 15, .65) 100%
  );
}

/* ========================================
   HEADER
======================================== */

#eden-music-page .em-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 82px;
  border-bottom: 1px solid var(--em-line);
}

#eden-music-page .em-logo {
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 7px;
  white-space: nowrap;
}

#eden-music-page .em-nav {
  display: flex;
  align-items: center;
  gap: clamp(18px, 3vw, 38px);
}

#eden-music-page .em-nav a {
  position: relative;
  padding: 12px 0;
  color: #b6c0d3;
  font-size: 10px;
  letter-spacing: 2px;
  transition: color .25s ease;
}

#eden-music-page .em-nav a:hover,
#eden-music-page .em-nav a.em-current {
  color: var(--em-accent);
}

#eden-music-page .em-nav a.em-current::after {
  content: "";
  position: absolute;
  bottom: 2px;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--em-accent);
  box-shadow: 0 0 10px rgba(169, 190, 255, .5);
}

#eden-music-page .em-bottom-nav {
  display: none;
}

/* ========================================
   HERO
======================================== */

#eden-music-page .em-hero {
  position: relative;
  text-align: center;
  padding: clamp(70px, 10vw, 115px) 10px 65px;
  background:
    radial-gradient(
      ellipse at 50% 35%,
      rgba(62, 105, 181, .12) 0%,
      transparent 68%
    );
}

/* 上部ライン */
#eden-music-page .em-hero::before {
  content: "";
  position: absolute;
  top: 28px;
  left: 50%;
  width: min(220px, 45%);
  height: 1px;
  transform: translateX(-50%);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(169, 190, 255, .85),
    transparent
  );
  box-shadow: 0 0 14px rgba(112, 151, 255, .35);
}

#eden-music-page .em-eyebrow {
  margin: 0;
  color: #a9beff;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 5px;
  line-height: 1.8;
}

/* SOUND LABO */
#eden-music-page .em-hero h1 {
  position: relative;
  margin: 23px 0 30px;
  font-family: "Times New Roman", Georgia, serif;
  font-size: clamp(43px, 8vw, 82px);
  font-weight: normal;
  line-height: 1.2;
  letter-spacing: clamp(4px, 1.2vw, 12px);
  color: #f6f8ff;
  text-shadow:
    0 0 18px rgba(132, 172, 255, .25),
    0 0 42px rgba(78, 126, 219, .2);
}

#eden-music-page .em-hero h1::after {
  content: "";
  display: block;
  width: 70px;
  height: 2px;
  margin: 23px auto 0;
  background: linear-gradient(
    90deg,
    transparent,
    #a9beff,
    transparent
  );
  box-shadow: 0 0 15px rgba(169, 190, 255, .55);
  animation: eden-title-glow 3s ease-in-out infinite alternate;
}

@keyframes eden-title-glow {
  from {
    opacity: .45;
    width: 42px;
  }
  to {
    opacity: 1;
    width: 90px;
  }
}

/* ========================================
   HERO LINKS
======================================== */

#eden-music-page .em-hero-links {
  display: flex;
  justify-content: center;
  align-items: stretch;
  flex-wrap: wrap;
  gap: 12px;
  max-width: 650px;
  margin: 0 auto 28px;
}

#eden-music-page .em-hero-links a {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  min-width: 175px;
  padding: 16px 19px;
  overflow: hidden;
  border: 1px solid rgba(169, 190, 255, .3);
  background: linear-gradient(
    135deg,
    rgba(35, 54, 91, .4),
    rgba(9, 15, 29, .65)
  );
  color: #edf2ff;
  font-size: 10px;
  letter-spacing: 2.5px;
  transition:
    color .3s ease,
    border-color .3s ease,
    background .3s ease,
    transform .3s ease,
    box-shadow .3s ease;
}

#eden-music-page .em-hero-links a::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -130%;
  width: 80%;
  transform: skewX(-22deg);
  background: linear-gradient(
    90deg,
    transparent,
    rgba(169, 190, 255, .2),
    transparent
  );
  transition: left .65s ease;
}

#eden-music-page .em-hero-links a:hover::before {
  left: 150%;
}

#eden-music-page .em-hero-links a:hover {
  border-color: rgba(169, 190, 255, .9);
  background: rgba(48, 72, 120, .5);
  box-shadow: 0 0 26px rgba(103, 148, 235, .16);
  transform: translateY(-3px);
}

#eden-music-page .em-hero-links a span {
  position: relative;
  z-index: 1;
}

#eden-music-page .em-arrow {
  color: #a9beff;
  font-size: 15px;
  transition: transform .3s ease;
}

#eden-music-page .em-hero-links a:hover .em-arrow {
  transform: translate(3px, -3px);
}

#eden-music-page .em-line {
  width: 35px;
  height: 1px;
  margin: 32px auto 20px;
  background: rgba(169, 190, 255, .7);
}

#eden-music-page .em-hero-sub {
  margin: 0;
  color: #b0bdd7;
  font-family: "Yu Mincho", "Noto Serif JP", serif;
  font-size: 10px;
  letter-spacing: 2px;
  line-height: 2;
}

/* ========================================
   YOUTUBE SECTION
======================================== */

#eden-music-page .em-youtube {
  max-width: 1050px;
  margin: 0 auto;
  padding: 10px 0 80px;
  scroll-margin-top: 30px;
}

#eden-music-page .em-section-heading {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 25px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--em-line);
}

#eden-music-page .em-section-eyebrow {
  margin: 0 0 9px;
  color: var(--em-accent);
  font-size: 9px;
  letter-spacing: 3px;
}

#eden-music-page .em-section-heading h2 {
  margin: 0;
  font: normal clamp(25px, 4vw, 36px) Georgia, serif;
  letter-spacing: 2px;
}

#eden-music-page .em-release-count {
  color: var(--em-muted);
  font-size: 9px;
  letter-spacing: 2px;
  white-space: nowrap;
}

#eden-music-page .em-youtube-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #050914;
  border: 1px solid var(--em-line);
  box-shadow:
    0 18px 50px rgba(0, 0, 0, .28),
    0 0 30px rgba(48, 90, 190, .06);
}

#eden-music-page .em-youtube-frame iframe {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

#eden-music-page .em-youtube-note {
  margin: 17px 0 0;
  color: var(--em-muted);
  font-family: Georgia, serif;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
}

/* ========================================
   FOOTER
======================================== */

#eden-music-page .em-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 23px 0;
  border-top: 1px solid var(--em-line);
  color: var(--em-muted);
  font-size: 9px;
  letter-spacing: 1.5px;
}

#eden-music-page .em-footer a {
  color: var(--em-text);
  font: bold 17px Georgia, serif;
  letter-spacing: 4px;
}

#eden-music-page .em-footer p {
  margin: 0;
}

/* ========================================
   MOBILE NAVIGATION
======================================== */

@media (max-width: 700px) {
  #eden-music-page {
    padding: 0 17px 95px;
  }

  #eden-music-page .em-header {
    min-height: 70px;
  }

  #eden-music-page .em-logo {
    font-size: 26px;
  }

  #eden-music-page .em-nav {
    display: none;
  }

  #eden-music-page .em-bottom-nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    position: fixed;
    z-index: 99999;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    background: rgba(8, 11, 19, .96);
    border-top: 1px solid #29344a;
    box-shadow: 0 -8px 28px rgba(0, 0, 0, .25);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
  }

  #eden-music-page .em-bottom-link {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    min-width: 0;
    min-height: 48px;
    color: #8592aa;
    font: 9px Arial, sans-serif;
    letter-spacing: 1px;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  #eden-music-page .em-bottom-link svg {
    display: block;
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #eden-music-page .em-bottom-link.em-bottom-active {
    color: var(--em-accent);
  }

  #eden-music-page .em-hero {
    padding: 58px 0 43px;
  }

  #eden-music-page .em-hero::before {
    top: 20px;
    width: 140px;
  }

  #eden-music-page .em-eyebrow {
    font-size: 9px;
    letter-spacing: 3px;
  }

  #eden-music-page .em-hero h1 {
    margin: 21px 0 27px;
    font-size: clamp(35px, 9vw, 52px);
    letter-spacing: 4px;
  }

  #eden-music-page .em-hero-links {
    gap: 8px;
    margin-bottom: 24px;
  }

  #eden-music-page .em-hero-links a {
    flex: 1 1 auto;
    min-width: 0;
    justify-content: center;
    gap: 9px;
    padding: 13px 10px;
    font-size: 9px;
    letter-spacing: 1px;
  }

  #eden-music-page .em-arrow {
    font-size: 12px;
  }

  #eden-music-page .em-hero-sub {
    font-size: 9px;
    letter-spacing: .5px;
  }

  #eden-music-page .em-section-heading h2 {
    font-size: 27px;
  }

  #eden-music-page .em-release-count {
    font-size: 8px;
    letter-spacing: 1px;
  }

  #eden-music-page .em-youtube {
    padding-bottom: 45px;
  }

  #eden-music-page .em-footer {
    align-items: flex-start;
  }

  #eden-music-page .eden-ambient-glow {
    filter: blur(48px);
  }

  #eden-music-page .eden-light-beam {
    width: 260%;
    left: -80%;
  }

  #eden-music-page .eden-ambient-grid {
    background-size: 48px 48px;
    opacity: .09;
  }
}

@media (max-width: 360px) {
  #eden-music-page .em-hero-links a {
    padding: 11px 7px;
    gap: 5px;
    font-size: 8px;
  }

  #eden-music-page .em-hero h1 {
    letter-spacing: 3px;
  }
}

/* 動きを減らす設定が有効な端末 */
@media (prefers-reduced-motion: reduce) {
  #eden-music-page .eden-ambient-glow,
  #eden-music-page .eden-light-beam,
  #eden-music-page .eden-ambient-grid,
  #eden-music-page .em-hero h1::after {
    animation: none !important;
  }

  #eden-music-page .em-hero-links a,
  #eden-music-page .em-hero-links a::before {
    transition: none !important;
  }
}

@media screen and (max-width: 700px) {
  #eden-music-page {
    outline: 5px solid red !important;
  }
}
</style>

<script>
(function () {
  var root = document.getElementById('eden-music-page');
  if (!root || root.dataset.edenMotionReady === '1') return;
  root.dataset.edenMotionReady = '1';

  var canvas = root.querySelector('#eden-light-canvas');
  if (!canvas) return;

  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var reduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var particles = [];
  var width = 0;
  var height = 0;
  var dpr = 1;
  var raf = 0;
  var lastTime = 0;
  var paused = document.hidden;

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var count = Math.min(
      100,
      Math.max(28, Math.floor(width * height / 14000))
    );

    particles = [];

    for (var i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.7 + 0.4,
        alpha: Math.random() * 0.55 + 0.2,
        vx: (Math.random() - 0.5) * 0.32,
        vy: -(Math.random() * 0.3 + 0.06),
        phase: Math.random() * Math.PI * 2,
        twinkle: Math.random() * 0.018 + 0.004
      });
    }

    draw();
  }

  function draw(timestamp) {
    if (!ctx) return;

    var delta = lastTime ? Math.min((timestamp - lastTime) / 16.67, 2) : 1;
    lastTime = timestamp || 0;

    ctx.clearRect(0, 0, width, height);

    particles.forEach(function (p) {
      if (!reduced) {
        p.x += p.vx * delta;
        p.y += p.vy * delta;
        p.phase += p.twinkle * delta;

        if (p.y < -5) {
          p.y = height + 5;
          p.x = Math.random() * width;
        }
        if (p.x < -5) p.x = width + 5;
        if (p.x > width + 5) p.x = -5;
      }

      var glow = 0.55 + 0.45 * Math.sin(p.phase);
      var alpha = Math.max(0.08, p.alpha * glow);

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(170,200,255,' + alpha + ')';
      ctx.fill();

      if (p.r > 1.5) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * 3.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(90,145,255,' + (alpha * 0.08) + ')';
        ctx.fill();
      }
    });

    if (!reduced && !paused) {
      raf = window.requestAnimationFrame(draw);
    }
  }

  function start() {
    if (reduced || paused || raf) return;
    lastTime = 0;
    raf = window.requestAnimationFrame(function (timestamp) {
      raf = 0;
      draw(timestamp);
    });
  }

  function stop() {
    if (raf) {
      window.cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  document.addEventListener('visibilitychange', function () {
    paused = document.hidden;
    if (paused) {
      stop();
    } else if (!reduced) {
      start();
    }
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () {
      resize();
      if (!reduced && !paused) start();
    }, 150);
  });

  resize();

  if (!reduced && !paused) start();
})();
</script>

</body>
</html>
