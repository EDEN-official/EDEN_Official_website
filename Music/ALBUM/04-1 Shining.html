<style>
#eden-album-detail {
  --bg:#080b13;
  --panel:#111827;
  --line:#283249;
  --text:#f4f6fc;
  --muted:#96a3ba;
  --accent:#a8beff;
  background:var(--bg);
  color:var(--text);
  padding:clamp(18px,4vw,38px);
  border:1px solid #202a3c;
  border-radius:16px;
  font-family:Arial,"Helvetica Neue",sans-serif;
  box-sizing:border-box;
}
#eden-album-detail *,
#eden-album-detail *::before,
#eden-album-detail *::after {
  box-sizing:border-box;
}

/* HEADER */
#eden-album-detail .ead-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  min-height:70px;
  margin-bottom:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
#eden-album-detail .ead-logo {
  color:var(--text);
  font:bold 28px Georgia,serif;
  letter-spacing:6px;
  text-decoration:none;
}
#eden-album-detail .ead-nav {
  display:flex;
  align-items:center;
  gap:clamp(14px,3vw,32px);
}
#eden-album-detail .ead-nav a {
  color:#b6c0d3;
  font-size:10px;
  letter-spacing:2px;
  text-decoration:none;
}
#eden-album-detail .ead-nav a:hover,
#eden-album-detail .ead-nav a.ead-current {
  color:var(--accent);
}
#eden-album-detail .ead-bottom-nav {
  display:none;
}

/* BACK */
#eden-album-detail .ead-back {
  color:var(--muted);
  text-decoration:none;
  font-size:11px;
  letter-spacing:1.5px;
  display:inline-block;
  margin-bottom:28px;
}
#eden-album-detail .ead-back:hover {
  color:var(--accent);
}

/* ALBUM HERO */
#eden-album-detail .ead-hero {
  display:grid;
  grid-template-columns:minmax(150px,270px) 1fr;
  align-items:center;
  gap:clamp(20px,5vw,40px);
  padding-bottom:32px;
  border-bottom:1px solid var(--line);
}
#eden-album-detail .ead-cover {
  aspect-ratio:1;
  overflow:hidden;
  background:var(--panel);
  border:1px solid #35415a;
  box-shadow:0 12px 35px #0007;
}
#eden-album-detail .ead-cover img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
#eden-album-detail .ead-label {
  color:var(--accent);
  font-size:10px;
  letter-spacing:2px;
}
#eden-album-detail .ead-info h1 {
  font:normal clamp(24px,4vw,38px) Georgia,serif;
  margin:13px 0;
  overflow-wrap:anywhere;
}
#eden-album-detail .ead-artist {
  font-size:13px;
  color:#d7deeb;
}
#eden-album-detail .ead-meta {
  font-size:10px;
  color:var(--muted);
  letter-spacing:1px;
  margin-top:20px;
}
#eden-album-detail .ead-play-all {
  margin-top:15px;
  padding:12px 18px;
  background:var(--accent);
  color:#080b13;
  border:0;
  border-radius:4px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

/* YOUTUBE */
#eden-album-detail .ead-player-section {
  margin-top:28px;
}
#eden-album-detail .ead-section-title {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:13px;
  font-size:10px;
  letter-spacing:2px;
}
#eden-album-detail .ead-section-title h2 {

  letter-spacing:3px;
  margin:0;
}
#eden-album-detail .ead-status,
#eden-album-detail .ead-section-title>span:last-child {

  font-size:9px;
}

#eden-album-detail .ead-video {
  position:relative;
  width:100%;
  max-width:800px;
  margin:0 auto;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:7px;
}
#eden-album-detail .ead-video iframe {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
}

/* TRACKLIST */
#eden-album-detail .ead-track-section {
  margin-top:32px;
}
#eden-album-detail .ead-track-list {
  border-top:1px solid var(--line);
}
#eden-album-detail .ead-track {
  width:100%;
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 12px;
  background:transparent;
  color:var(--text);
  border:0;
  border-bottom:1px solid var(--line);
  text-align:left;
  cursor:pointer;
  font:inherit;
}
#eden-album-detail .ead-track:hover,
#eden-album-detail .ead-track.active {

}
#eden-album-detail .ead-track.active {

}
#eden-album-detail .ead-num {

  font-size:11px;

#eden-album-detail .ead-track-name {

  flex-direction:column;
  gap:5px;
  flex:1;
  min-width:0;
}
#eden-album-detail .ead-track-name strong {
  font-size:12px;
  letter-spacing:1px;
  overflow-wrap:anywhere;

#eden-album-detail .ead-track-name small {

#eden-album-detail .ead-track-play {

/* FOOTER */
#eden-album-detail .ead-footer {

  padding-top:18px;
  margin-top:30px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1.5px;
}

/* MOBILE */
@media(max-width:700px) {

    box-shadow:0 -8px 28px rgba(0,0,0,.22);

    -webkit-backdrop-filter:blur(16px);

  #eden-album-detail .ead-bottom-link {
    display:flex;

    min-height:48px;

    font:9px Arial,sans-serif;
    letter-spacing:1px;
    text-decoration:none;
  }
  #eden-album-detail .ead-bottom-link svg {
    width:22px;
    height:22px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  #eden-album-detail .ead-bottom-link.ead-bottom-active {
    color:var(--accent);
  }
  #eden-album-detail .ead-hero {
    grid-template-columns:1fr;
    gap:22px;
  }
  #eden-album-detail .ead-cover {
    width:min(100%,280px);
  }
  #eden-album-detail .ead-info h1 {
    font-size:29px;
  }
}
</style>

<script>
(function () {
  const root = document.getElementById("eden-album-detail");
  if (!root || root.dataset.playerReady === "1") return;
  root.dataset.playerReady = "1";

  const iframe = root.querySelector("#ead-youtube");
  const tracks = Array.from(root.querySelectorAll(".ead-track"));
  const playAll = root.querySelector(".ead-play-all");
  const playerSection = root.querySelector(".ead-player-section");

  let player = null;
  let activeIndex = -1;
  let apiReady = false;
  let pendingVideoId = null;

  function markActive(index) {
    tracks.forEach(function (item, i) {
      item.classList.toggle("active", i === index);
      const icon = item.querySelector(".ead-track-play");
      if (icon) icon.textContent = i === index ? "♫" : "▶";
    });
  }

  function validVideoId(track) {
    const id = track && track.dataset.id;
    return id && !id.includes("VIDEO_ID") ? id : null;
  }

  function loadTrack(index) {
    if (index < 0 || index >= tracks.length) return;

    const id = validVideoId(tracks[index]);
    if (!id) {
      // 未設定の動画IDは飛ばし、次に登録済みの曲を探す
      loadNextPlayable(index + 1);
      return;
    }

    activeIndex = index;
    markActive(index);

    if (player && apiReady) {
      player.loadVideoById(id);
    } else {
      pendingVideoId = id;
      iframe.src = "https://www.youtube-nocookie.com/embed/" +
        encodeURIComponent(id) +
        "?enablejsapi=1&autoplay=1&playsinline=1&rel=0";
      loadYouTubeAPI();
    }
  }

  function loadNextPlayable(startIndex) {
    for (let i = startIndex; i < tracks.length; i++) {
      if (validVideoId(tracks[i])) {
        loadTrack(i);
        return;
      }
    }
    // 次に再生できる登録済み動画がない場合は、最後の曲で停止
  }

  function onPlayerStateChange(event) {
    // YouTube PlayerState.ENDED === 0：曲が終わったら次の登録済み曲へ
    if (event.data === 0) {
      loadNextPlayable(activeIndex + 1);
    }
  }

  function initPlayer() {
    if (apiReady || !window.YT || !window.YT.Player) return;
    apiReady = true;

    player = new YT.Player(iframe, {
      events: {
        onReady: function () {
          if (pendingVideoId) {
            player.loadVideoById(pendingVideoId);
            pendingVideoId = null;
          } else {
            // ページ表示時の自動再生を試みる（ブラウザ側で制限される場合あり）
            player.playVideo();
          }
        },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function loadYouTubeAPI() {
    if (window.YT && window.YT.Player) {
      initPlayer();
      return;
    }

    if (document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
      const waitForAPI = window.setInterval(function () {
        if (window.YT && window.YT.Player) {
          window.clearInterval(waitForAPI);
          initPlayer();
        }
      }, 100);
      window.setTimeout(function () { window.clearInterval(waitForAPI); }, 10000);
      return;
    }

    const previousCallback = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      if (typeof previousCallback === "function") previousCallback();
      initPlayer();
    };

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    tag.async = true;
    document.head.appendChild(tag);
  }

  tracks.forEach(function (track, index) {
    track.addEventListener("click", function () {
      const id = validVideoId(track);
      if (!id) {
        alert("この曲のYouTube動画IDを設定してください。");
        return;
      }
      loadTrack(index);
    });
  });

  if (playAll) {
    playAll.addEventListener("click", function () {
      loadNextPlayable(0);
      if (playerSection) {
        playerSection.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  }
})();
</script>
